services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: yals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yals"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dbmigrate
    environment:
      ConnectionStrings__Database: "Host=db;Port=5432;Database=yals;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5090:5090"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=db;Port=5432;Database=yals;Username=postgres;Password=postgres"
    volumes:
      # Mount source so dotnet watch picks up changes
      - .:/app
      # Isolate NuGet cache and build output from the host
      - nuget-cache:/root/.nuget
      - build-cache:/app/Yals/obj
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  nuget-cache:
  build-cache:
